apiVersion: cultivator/v1
kind: Module
metadata:
  name: worker
spec:
  dependsOn:
    - database
    - name: api
      propagate: false
  inputs:
    region: ${vars.region}
    replicas: ${vars.replicas}
  watch:
    - "src/**"
  apply:
    - mkdir -p "$CULTIVATOR_ROOT/.deployed/${environment}"
    - echo "worker replicas=${inputs.replicas} region=${inputs.region}" > "$CULTIVATOR_ROOT/.deployed/${environment}/${module.name}"
  check: test -f "$CULTIVATOR_ROOT/.deployed/${environment}/${module.name}"
  destroy: rm -f "$CULTIVATOR_ROOT/.deployed/${environment}/${module.name}"
