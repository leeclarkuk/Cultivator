apiVersion: cultivator/v1
kind: Module
metadata:
  name: api
spec:
  dependsOn: [database]
  inputs:
    site: ${vars.site}
    replicas: ${vars.replicas}
  watch:
    - "src/**"
  apply:
    - mkdir -p "$CULTIVATOR_ROOT/.deployed/${environment}"
    - echo "api replicas=${inputs.replicas} site=${inputs.site}" > "$CULTIVATOR_ROOT/.deployed/${environment}/${module.name}"
  check: test -f "$CULTIVATOR_ROOT/.deployed/${environment}/${module.name}"
  destroy: rm -f "$CULTIVATOR_ROOT/.deployed/${environment}/${module.name}"
